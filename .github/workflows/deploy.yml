name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos mínimos que necesita la acción oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, publica el último. No se cancela a mitad
# para no dejar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar el sitio estático
        env:
          # `configure-pages` deduce de la configuración del repositorio dónde
          # va a vivir el sitio, así que estas dos líneas cubren los tres casos
          # sin volver a tocar este fichero:
          #
          #   repo de proyecto       → base_path '/meson-la-solana'
          #   repo USUARIO.github.io → base_path '/'
          #   dominio propio         → base_path '/', origin https://tu-dominio
          #
          # El caso del medio necesita la normalización de `next.config.ts`:
          # Next se niega a arrancar con un basePath acabado en barra, así que
          # allí '/' se convierte en cadena vacía.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - name: Desactivar Jekyll
        # Ya viene en public/, pero se reescribe aquí por si acaso: sin este
        # fichero Pages pasa la salida por Jekyll, que ignora los directorios
        # con guion bajo, y `_next/` se quedaría fuera — el sitio saldría sin
        # estilos ni JavaScript.
        run: touch out/.nojekyll

      # La acción empaqueta la carpeta en un tar antes de subirla, así que el
      # `.nojekyll` viaja dentro y no le afecta la exclusión de ficheros ocultos
      # de `upload-artifact@v4`: aquí no hace falta `include-hidden-files`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
